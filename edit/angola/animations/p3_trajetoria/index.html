<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E1013; }
      #root { width: 100%; height: 100%;
              font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .clip { position: absolute; inset: 0; }
      #cena { background: #0E1013; }
      svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .rotulo { font-size: 30px; font-weight: 700; fill: #F2EFE9; text-anchor: middle; }
      .selo   { font-size: 40px; font-weight: 700; letter-spacing: 0.16em; text-anchor: middle; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17"
         data-width="1920" data-height="1080">
      <div id="cena" class="clip" data-start="0" data-duration="17" data-track-index="0">
        <svg viewBox="0 0 1920 1080">
          <defs>
            <clipPath id="revela"><rect id="janela" x="190" y="200" width="0" height="640"/></clipPath>
          </defs>

          <!-- ===== FASE A: linha do tempo ===== -->
          <g id="linhaDoTempo">
            <line id="trilho" x1="210" y1="540" x2="1710" y2="540"
                  stroke="#3A3F47" stroke-width="5" stroke-linecap="round"/>
            <g id="n1"><circle cx="210"  cy="540" r="19" fill="#E90404"/>
              <text class="rotulo" x="210"  y="612">Terreno vazio</text></g>
            <g id="n2"><circle cx="585"  cy="540" r="19" fill="#FE8E04"/>
              <text class="rotulo" x="585"  y="612">Limpeza e reforma</text></g>
            <g id="n3"><circle cx="960"  cy="540" r="19" fill="#FDB304"/>
              <text class="rotulo" x="960"  y="612">Muro pintado</text></g>
            <g id="n4"><circle cx="1335" cy="540" r="19" fill="#057025"/>
              <text class="rotulo" x="1335" y="612">Primeiras aulas</text></g>
            <g id="n5"><circle cx="1710" cy="540" r="24" fill="#F2EFE9"/>
              <text class="rotulo" x="1710" y="617">Hoje</text></g>
          </g>

          <!-- ===== FASE B: antes e depois ===== -->
          <g id="painel" opacity="0">
            <!-- ANTES: terreno de terra e muro cinza -->
            <g id="antes">
              <rect x="190" y="200" width="1540" height="640" fill="#23272D"/>
              <rect x="190" y="620" width="1540" height="220" fill="#4A4034"/>
              <rect x="300" y="330" width="1320" height="290" fill="#5A5F66"/>
              <rect x="300" y="318" width="1320" height="16" fill="#6B7178"/>
              <circle cx="470" cy="700" r="13" fill="#5C5042"/>
              <circle cx="560" cy="742" r="9"  fill="#5C5042"/>
              <circle cx="1300" cy="716" r="11" fill="#5C5042"/>
            </g>
            <!-- DEPOIS: muro pintado, lona e cadeiras -->
            <g id="depois" clip-path="url(#revela)">
              <rect x="190" y="200" width="1540" height="640" fill="#1A1E23"/>
              <rect x="190" y="620" width="1540" height="220" fill="#3F7A2E"/>
              <rect x="300" y="330" width="1320" height="290" fill="#D9D3C6"/>
              <rect x="300" y="318" width="1320" height="16" fill="#EFE9DC"/>
              <rect x="300" y="560" width="440" height="60" fill="#E90404"/>
              <rect x="740" y="560" width="440" height="60" fill="#FDB304"/>
              <rect x="1180" y="560" width="440" height="60" fill="#057025"/>
              <path d="M 190,200 L 960,286 L 1730,200 L 1730,250 L 960,330 L 190,250 Z" fill="#2E6FA8"/>
              <g fill="#2F5FA6">
                <rect x="430"  y="672" width="118" height="92" rx="14"/>
                <rect x="610"  y="672" width="118" height="92" rx="14"/>
                <rect x="790"  y="672" width="118" height="92" rx="14"/>
                <rect x="1010" y="672" width="118" height="92" rx="14"/>
                <rect x="1190" y="672" width="118" height="92" rx="14"/>
                <rect x="1370" y="672" width="118" height="92" rx="14"/>
              </g>
              <g fill="#17202A">
                <circle cx="489"  cy="650" r="27"/><circle cx="669"  cy="650" r="27"/>
                <circle cx="849"  cy="650" r="27"/><circle cx="1069" cy="650" r="27"/>
                <circle cx="1249" cy="650" r="27"/><circle cx="1429" cy="650" r="27"/>
              </g>
            </g>
            <!-- linha que corre revelando -->
            <line id="corte" x1="190" y1="200" x2="190" y2="840"
                  stroke="#FDB304" stroke-width="6" opacity="0"/>
            <text id="selAntes"  class="selo" x="430"  y="898" fill="#8A9099">ANTES</text>
            <text id="selDepois" class="selo" x="1480" y="898" fill="#FDB304" opacity="0">DEPOIS</text>
          </g>
        </svg>
      </div>
    </div>
    <script>
      const trilho = document.getElementById('trilho');
      const L = trilho.getTotalLength();
      trilho.style.strokeDasharray = L;
      trilho.style.strokeDashoffset = L;

      const tl = gsap.timeline({ paused: true });

      // o trilho se desenha devagar: "foi um caminho longo"
      tl.to("#trilho", { strokeDashoffset: 0, duration: 2.1, ease: "power2.inOut" }, 0.15);

      // os 5 pontos acendem um por vez
      const nos = ["#n1","#n2","#n3","#n4","#n5"];
      nos.forEach((n,i) => {
        tl.fromTo(n, { opacity: 0, scale: 0.55, transformOrigin: "center center" },
                     { opacity: 1, scale: 1, duration: 0.62, ease: "power3.out" }, 2.25 + i*1.40);
      });

      // a linha do tempo sai e o painel entra
      tl.to("#linhaDoTempo", { opacity: 0, duration: 0.55, ease: "power2.inOut" }, 9.35);
      tl.to("#painel",       { opacity: 1, duration: 0.70, ease: "power2.out"  }, 9.70);

      // a linha corre revelando o depois
      tl.to("#corte",   { opacity: 1, duration: 0.30, ease: "power2.out" }, 10.60);
      tl.to("#janela",  { attr: { width: 1540 }, duration: 3.40, ease: "power2.inOut" }, 10.80);
      tl.to("#corte",   { attr: { x1: 1730, x2: 1730 }, duration: 3.40, ease: "power2.inOut" }, 10.80);
      tl.to("#selDepois", { opacity: 1, duration: 0.55, ease: "power3.out" }, 13.30);
      tl.to("#selAntes", { opacity: 0, duration: 0.50, ease: "power2.inOut" }, 12.05);
      tl.to("#corte",   { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 14.25);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
