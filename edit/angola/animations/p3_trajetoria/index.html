<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E1013; }
      #root { width: 100%; height: 100%;
              font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .clip { position: absolute; inset: 0; }
      #cena { background: #0E1013; }
      svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .rotulo { font-size: 30px; font-weight: 700; fill: #F2EFE9; text-anchor: middle; }
      .selo   { font-size: 42px; font-weight: 700; letter-spacing: 0.16em; text-anchor: middle; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17"
         data-width="1920" data-height="1080">
      <div id="cena" class="clip" data-start="0" data-duration="17" data-track-index="0">
        <svg viewBox="0 0 1920 1080">
          <defs>
            <clipPath id="revela"><rect id="janela" x="0" y="0" width="0" height="1080"/></clipPath>
            <linearGradient id="veu" x1="0" y1="0.55" x2="0" y2="1">
              <stop offset="0"   stop-color="#0A0C0E" stop-opacity="0"/>
              <stop offset="1"   stop-color="#0A0C0E" stop-opacity="0.82"/>
            </linearGradient>
          </defs>

          <!-- ===== FASE A: linha do tempo ===== -->
          <g id="linhaDoTempo">
            <line id="trilho" x1="210" y1="540" x2="1710" y2="540"
                  stroke="#3A3F47" stroke-width="5" stroke-linecap="round"/>
            <g id="n1"><circle cx="210"  cy="540" r="19" fill="#E90404"/>
              <text class="rotulo" x="210"  y="612">Terreno vazio</text></g>
            <g id="n2"><circle cx="585"  cy="540" r="19" fill="#FE8E04"/>
              <text class="rotulo" x="585"  y="612">Limpeza e reforma</text></g>
            <g id="n3"><circle cx="960"  cy="540" r="19" fill="#FDB304"/>
              <text class="rotulo" x="960"  y="612">Muro pintado</text></g>
            <g id="n4"><circle cx="1335" cy="540" r="19" fill="#057025"/>
              <text class="rotulo" x="1335" y="612">Primeiras aulas</text></g>
            <g id="n5"><circle cx="1710" cy="540" r="24" fill="#F2EFE9"/>
              <text class="rotulo" x="1710" y="617">Hoje</text></g>
          </g>

          <!-- ===== FASE B: antes e depois, fotos reais do portao ===== -->
          <g id="painel" opacity="0">
            <image id="imgAntes"  href="assets/antes.jpg"  x="0" y="0" width="1920" height="1080"
                   preserveAspectRatio="xMidYMid slice"/>
            <g clip-path="url(#revela)">
              <image id="imgDepois" href="assets/depois.jpg" x="0" y="0" width="1920" height="1080"
                     preserveAspectRatio="xMidYMid slice"/>
            </g>
            <rect x="0" y="0" width="1920" height="1080" fill="url(#veu)"/>
            <line id="corte" x1="0" y1="0" x2="0" y2="1080"
                  stroke="#FDB304" stroke-width="7" opacity="0"/>
            <text id="selAntes"  class="selo" x="300"  y="986" fill="#D6D2CA">ANTES</text>
            <text id="selDepois" class="selo" x="1620" y="986" fill="#FDB304" opacity="0">DEPOIS</text>
          </g>
        </svg>
      </div>
    </div>
    <script>
      const trilho = document.getElementById('trilho');
      const L = trilho.getTotalLength();
      trilho.style.strokeDasharray = L;
      trilho.style.strokeDashoffset = L;

      const tl = gsap.timeline({ paused: true });

      // o trilho se desenha devagar: "foi um caminho longo"
      tl.to("#trilho", { strokeDashoffset: 0, duration: 2.1, ease: "power2.inOut" }, 0.15);

      // os 5 pontos acendem um por vez
      ["#n1","#n2","#n3","#n4","#n5"].forEach((n,i) => {
        tl.fromTo(n, { opacity: 0, scale: 0.55, transformOrigin: "center center" },
                     { opacity: 1, scale: 1, duration: 0.62, ease: "power3.out" }, 2.25 + i*1.40);
      });

      // sai a linha do tempo, entram as fotos
      tl.to("#linhaDoTempo", { opacity: 0, duration: 0.55, ease: "power2.inOut" }, 9.35);
      tl.to("#painel",       { opacity: 1, duration: 0.75, ease: "power2.out"  }, 9.70);

      // aproximacao lenta nas duas fotos, para a cena respirar
      tl.fromTo(["#imgAntes","#imgDepois"],
                { scale: 1.00, transformOrigin: "58% 60%" },
                { scale: 1.06, duration: 7.3, ease: "none" }, 9.70);

      // a linha amarela corre revelando o depois
      tl.to("#corte",  { opacity: 1, duration: 0.30, ease: "power2.out" }, 10.70);
      tl.to("#janela", { attr: { width: 1920 }, duration: 3.60, ease: "power2.inOut" }, 10.90);
      tl.to("#corte",  { attr: { x1: 1920, x2: 1920 }, duration: 3.60, ease: "power2.inOut" }, 10.90);
      tl.to("#selAntes",  { opacity: 0, duration: 0.50, ease: "power2.inOut" }, 11.70);
      tl.to("#selDepois", { opacity: 1, duration: 0.55, ease: "power3.out"  }, 13.50);
      tl.to("#corte",     { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 14.55);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
