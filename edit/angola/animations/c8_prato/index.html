<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e1013;
      }
      #root {
        width: 100%;
        height: 100%;
        background: #0e1013;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #f2efe9;
      }
      #cena {
        position: absolute;
        inset: 0;
      }

      .objeto {
        position: absolute;
        left: 750px;
        top: 260px;
        width: 420px;
        height: 420px;
        opacity: 0;
      }

      #preco {
        position: absolute;
        left: 0;
        top: 733px;
        width: 1920px;
        text-align: center;
        font-size: 46px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: 0.005em;
        color: #a8aeb6;
        opacity: 0;
      }

      #frase {
        position: absolute;
        left: 0;
        top: 470px;
        width: 1920px;
        text-align: center;
        font-size: 104px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: #f2efe9;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14"
      data-width="1920"
      data-height="1080"
    >
      <div id="cena" class="clip" data-start="0" data-duration="14" data-track-index="0">
        <!-- 1. PRATO -->
        <div id="prato" class="objeto">
          <svg viewBox="0 0 420 420" width="420" height="420" fill="none">
            <g transform="translate(148,172)">
              <g class="comida" id="f1">
                <ellipse cx="0" cy="0" rx="58" ry="44" fill="#fdb304" />
              </g>
            </g>
            <g transform="translate(272,172)">
              <g class="comida" id="f2">
                <rect x="-55" y="-38" width="110" height="76" rx="34" fill="#057025" />
              </g>
            </g>
            <g transform="translate(210,288)">
              <g class="comida" id="f3">
                <ellipse cx="0" cy="0" rx="66" ry="46" fill="#e90404" />
              </g>
            </g>
            <circle
              cx="210"
              cy="210"
              r="198"
              stroke="#f2efe9"
              stroke-width="12"
              fill="none"
            />
            <circle
              cx="210"
              cy="210"
              r="150"
              stroke="#f2efe9"
              stroke-width="7"
              fill="none"
            />
          </svg>
        </div>

        <!-- 2. CADERNO -->
        <div id="caderno" class="objeto">
          <svg viewBox="0 0 420 420" width="420" height="420" fill="none">
            <rect x="85" y="45" width="250" height="330" rx="14" fill="#0e1013" />
            <rect x="92" y="52" width="40" height="316" rx="8" fill="#fdb304" />
            <rect
              x="85"
              y="45"
              width="250"
              height="330"
              rx="14"
              stroke="#f2efe9"
              stroke-width="12"
              fill="none"
            />
            <line
              x1="132"
              y1="45"
              x2="132"
              y2="375"
              stroke="#f2efe9"
              stroke-width="9"
            />
            <g stroke="#f2efe9" stroke-width="12" stroke-linecap="round">
              <line x1="165" y1="120" x2="302" y2="120" />
              <line x1="165" y1="180" x2="302" y2="180" />
              <line x1="165" y1="240" x2="302" y2="240" />
              <line x1="165" y1="300" x2="258" y2="300" />
            </g>
          </svg>
        </div>

        <!-- 3. QUADRO DE AULA -->
        <div id="quadro" class="objeto">
          <svg viewBox="0 0 420 420" width="420" height="420" fill="none">
            <rect x="42" y="98" width="336" height="232" rx="14" fill="#0e1013" />
            <rect
              x="42"
              y="98"
              width="336"
              height="232"
              rx="14"
              stroke="#fe8e04"
              stroke-width="22"
              fill="none"
            />
            <text
              x="210"
              y="214"
              text-anchor="middle"
              dominant-baseline="central"
              fill="#f2efe9"
              font-family="Inter, ui-sans-serif, system-ui, sans-serif"
              font-size="96"
              font-weight="700"
              letter-spacing="10"
            >
              A B C
            </text>
          </svg>
        </div>

        <!-- Linha de preço -->
        <div id="preco">1 refeição · menos de R$ 9 (1.500 Kz)</div>

        <!-- Frase final -->
        <div id="frase">Sua doação salva vidas</div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // 0.40 - 1.30 : prato entra
      tl.fromTo(
        "#prato",
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" },
        0.4
      );

      // 1.50 - 3.05 : o prato enche, uma forma de cada vez
      tl.fromTo(
        "#f1",
        { scale: 0 },
        { scale: 1, duration: 0.55, ease: "back.out(1.4)" },
        1.5
      );
      tl.fromTo(
        "#f2",
        { scale: 0 },
        { scale: 1, duration: 0.55, ease: "back.out(1.4)" },
        2.0
      );
      tl.fromTo(
        "#f3",
        { scale: 0 },
        { scale: 1, duration: 0.55, ease: "back.out(1.4)" },
        2.5
      );

      // 3.40 - 4.20 : linha de preço entra
      tl.fromTo(
        "#preco",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
        3.4
      );

      // 4.90 - 5.90 : prato -> caderno
      tl.to(
        "#prato",
        { opacity: 0, scale: 0.86, duration: 0.55, ease: "power2.inOut" },
        4.9
      );
      tl.fromTo(
        "#caderno",
        { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1, duration: 0.75, ease: "power2.inOut" },
        5.15
      );

      // 6.60 - 7.60 : caderno -> quadro
      tl.to(
        "#caderno",
        { opacity: 0, scale: 0.86, duration: 0.55, ease: "power2.inOut" },
        6.6
      );
      tl.fromTo(
        "#quadro",
        { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1, duration: 0.75, ease: "power2.inOut" },
        6.85
      );

      // 8.10 - 8.80 : linha de preço sai
      tl.to("#preco", { opacity: 0, duration: 0.7, ease: "power2.inOut" }, 8.1);

      // 9.00 - 10.00 : quadro sai, frase final entra sozinha
      tl.to(
        "#quadro",
        { opacity: 0, scale: 0.9, duration: 0.5, ease: "power2.inOut" },
        9.0
      );
      tl.fromTo(
        "#frase",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        9.4
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
