<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #000000;
      }
      #root {
        width: 100%;
        height: 100%;
        background: #000000;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* ---- foto do portao ---- */
      #foto {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        will-change: transform, opacity;
      }

      /* ---- pontinhos de luz ---- */
      .dots {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .dot {
        position: absolute;
        display: block;
        border-radius: 50%;
        background: #fdb304;
        filter: blur(1px);
      }

      /* ---- escurecimento do rodape ---- */
      #rodape {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.58) 0%,
          rgba(0, 0, 0, 0) 32%
        );
      }

      /* ---- tarja de localizacao ---- */
      #tarja {
        position: absolute;
        left: 86px;
        top: 84px;
        display: flex;
        align-items: center;
        gap: 22px;
        background: rgba(10, 12, 14, 0.72);
        border-radius: 10px;
        padding: 18px 28px;
      }
      #tarja-barra {
        display: block;
        width: 5px;
        height: 46px;
        border-radius: 3px;
        background: #fdb304;
      }
      #tarja-texto {
        display: block;
        color: #f2efe9;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-weight: 600;
        font-size: 38px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <div
        id="cena"
        class="clip"
        data-start="0"
        data-duration="10"
        data-track-index="0"
      >
        <img id="foto" data-layout-allow-overflow src="assets/portao.jpg" alt="Portão pintado do projeto" />

        <div class="dots">
          <span class="dot" id="d1" style="left: 180px; top: 420px; width: 7px; height: 7px"></span>
          <span class="dot" id="d2" style="left: 310px; top: 182px; width: 5px; height: 5px"></span>
          <span class="dot" id="d3" style="left: 523px; top: 332px; width: 9px; height: 9px"></span>
          <span class="dot" id="d4" style="left: 702px; top: 124px; width: 6px; height: 6px"></span>
          <span class="dot" id="d5" style="left: 916px; top: 468px; width: 11px; height: 11px"></span>
          <span class="dot" id="d6" style="left: 1124px; top: 238px; width: 5px; height: 5px"></span>
          <span class="dot" id="d7" style="left: 1336px; top: 392px; width: 8px; height: 8px"></span>
          <span class="dot" id="d8" style="left: 1542px; top: 158px; width: 6px; height: 6px"></span>
          <span class="dot" id="d9" style="left: 1727px; top: 498px; width: 7px; height: 7px"></span>
        </div>

        <div id="rodape"></div>

        <div id="tarja">
          <span id="tarja-barra"></span>
          <span id="tarja-texto">Sapú 2, Luanda, Angola</span>
        </div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* foto: entrada do preto 0.00 -> 0.90 */
      tl.fromTo(
        "#foto",
        { opacity: 0 },
        { opacity: 1, duration: 0.9, ease: "power2.out" },
        0
      );

      /* foto: aproximacao lenta ao longo de toda a cena */
      tl.fromTo(
        "#foto",
        { scale: 1.0, transformOrigin: "52% 55%" },
        { scale: 1.09, duration: 10, ease: "power1.inOut" },
        0
      );

      /* pontinhos de luz: subida lenta + pulso de opacidade */
      const pontos = [
        { id: "#d1", sobe: -52, op: 0.4, pulso: 3.4 },
        { id: "#d2", sobe: -44, op: 0.28, pulso: 2.8 },
        { id: "#d3", sobe: -61, op: 0.5, pulso: 4.0 },
        { id: "#d4", sobe: -47, op: 0.32, pulso: 3.1 },
        { id: "#d5", sobe: -68, op: 0.58, pulso: 4.4 },
        { id: "#d6", sobe: -41, op: 0.26, pulso: 2.6 },
        { id: "#d7", sobe: -57, op: 0.45, pulso: 3.7 },
        { id: "#d8", sobe: -50, op: 0.34, pulso: 3.3 },
        { id: "#d9", sobe: -64, op: 0.38, pulso: 2.9 },
      ];

      pontos.forEach(function (p) {
        tl.fromTo(
          p.id,
          { y: 0 },
          { y: p.sobe, duration: 10, ease: "power1.inOut" },
          0
        );
        tl.fromTo(
          p.id,
          { opacity: p.op * 0.42 },
          {
            opacity: p.op,
            duration: p.pulso,
            ease: "sine.inOut",
            yoyo: true,
            repeat: -1,
          },
          0
        );
      });

      /* tarja: 1.40 -> 2.30 */
      tl.fromTo(
        "#tarja",
        { opacity: 0, x: -26 },
        { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" },
        1.4
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
