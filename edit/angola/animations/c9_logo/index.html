<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1013;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #0e1013;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #f2efe9;
      }
      #cena {
        position: absolute;
        inset: 0;
        background: #0e1013;
        overflow: hidden;
      }

      /* ---------- frase de abertura ---------- */
      #abertura {
        position: absolute;
        left: 160px;
        right: 160px;
        top: 480px;
        height: 112px;
        line-height: 112px;
        text-align: center;
        font-size: 82px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #f2efe9;
        opacity: 0;
        white-space: nowrap;
      }

      /* ---------- palavras Aprender / Brincar / Crescer ---------- */
      #palavras {
        position: absolute;
        left: 0;
        right: 0;
        top: 440px;
        height: 84px;
      }
      .palavra {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 84px;
        line-height: 84px;
        text-align: center;
        font-size: 62px;
        font-weight: 700;
        letter-spacing: 0.005em;
        opacity: 0;
        white-space: nowrap;
      }
      #palavra-a {
        color: #e90404;
        box-sizing: border-box;
        padding-right: 436px;   /* centra sobre o A, em x=742 */
      }
      #palavra-b {
        color: #fdb304;
        box-sizing: border-box;
        padding-left: 12px;     /* centra sobre o B, em x=966 */
      }
      #palavra-c {
        color: #057025;
        box-sizing: border-box;
        padding-left: 432px;    /* centra sobre o C, em x=1176 */
      }

      /* ---------- bloco da logo (proporção original 1811 x 2491) ---------- */
      #logo {
        position: absolute;
        left: 683.7334px;
        top: 90px;
        width: 552.5331px;
        height: 760px;
      }
      #logo img {
        position: absolute;
        display: block;
        opacity: 0;
      }
      #emblema {
        left: 13.733%;
        top: 0.0%;
        width: 71.648%;
        height: 40.93%;
        z-index: 3;
      }
      #filos {
        left: 0.327%;
        top: 40.93%;
        width: 99.019%;
        height: 29.314%;
        z-index: 2;
      }
      #letra-a {
        left: 25.595%;
        top: 70.584%;
        width: 16.581%;
        height: 9.749%;
        z-index: 4;
      }
      #letra-b {
        left: 42.83%;
        top: 70.55%;
        width: 13.452%;
        height: 9.783%;
        z-index: 4;
      }
      #letra-c {
        left: 56.75%;
        top: 70.448%;
        width: 14.806%;
        height: 10.326%;
        z-index: 4;
      }
      #tagline {
        left: 0.0%;
        top: 81.182%;
        width: 100.0%;
        height: 7.133%;
        z-index: 2;
      }
      #instituto {
        left: 20.317%;
        top: 90.897%;
        width: 60.766%;
        height: 7.779%;
        z-index: 2;
      }

      /* ---------- Filos Editora, canto inferior direito ---------- */
      #editora {
        position: absolute;
        display: block;
        right: 70px;
        bottom: 60px;
        width: 300px;
        height: 153.7px;
        opacity: 0;
      }

      /* ---------- frase de fecho ---------- */
      #fecho {
        position: absolute;
        left: 400px;
        right: 400px;
        top: 930px;
        height: 64px;
        line-height: 64px;
        text-align: center;
        font-size: 50px;
        font-weight: 600;
        color: #a8aeb6;
        opacity: 0;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1920"
      data-height="1080"
    >
      <div id="cena" class="clip" data-start="0" data-duration="18" data-track-index="0">
        <div id="abertura">Seja parceiro do Filos ABC</div>

        <div id="palavras">
          <div id="palavra-a" class="palavra">Aprender</div>
          <div id="palavra-b" class="palavra">Brincar</div>
          <div id="palavra-c" class="palavra">Crescer</div>
        </div>

        <div id="logo">
          <img id="filos" src="assets/filos.png" alt="FILOS" />
          <img id="emblema" src="assets/emblema.png" alt="Emblema Filos ABC" />
          <img id="letra-a" src="assets/letra_A.png" alt="A" />
          <img id="letra-b" src="assets/letra_B.png" alt="B" />
          <img id="letra-c" src="assets/letra_C.png" alt="C" />
          <img id="tagline" src="assets/tagline.png" alt="Aprender, Brincar e Crescer" />
          <img id="instituto" src="assets/instituto.png" alt="Instituto Filos" />
        </div>

        <img id="editora" src="assets/editora.png" alt="Filos Editora" />

        <div id="fecho">Educar hoje é transformar o amanhã</div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      /* ---- abertura falada: 0 a 3.4 s ---- */
      tl.fromTo(
        "#abertura",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
        0.3
      );
      tl.to("#abertura", { opacity: 0, y: -18, duration: 0.8, ease: "power2.inOut" }, 1.70);

      /* ---- batida 1: A / Aprender ---- */
      tl.fromTo(
        "#letra-a",
        { opacity: 0, y: -260, scale: 1.25 },
        { opacity: 1, y: 0, scale: 1, duration: 0.52, ease: "back.out(2.2)" },
        2.14
      );
      tl.fromTo(
        "#palavra-a",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        2.14
      );
      tl.to("#palavra-a", { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.48);

      /* ---- batida 2: B / Brincar ---- */
      tl.fromTo(
        "#letra-b",
        { opacity: 0, y: 120, scale: 0.8 },
        { opacity: 1, y: 0, scale: 1, duration: 0.52, ease: "back.out(2.6)" },
        2.58
      );
      tl.fromTo(
        "#palavra-b",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        2.58
      );
      tl.to("#palavra-b", { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.91);

      /* ---- batida 3: C / Crescer ---- */
      tl.fromTo(
        "#letra-c",
        { opacity: 0, y: 200, scale: 0.85 },
        { opacity: 1, y: 0, scale: 1, duration: 0.52, ease: "back.out(2.2)" },
        3.01
      );
      tl.fromTo(
        "#palavra-c",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" },
        3.01
      );
      tl.to("#palavra-c", { opacity: 0, y: -12, duration: 0.7, ease: "power2.inOut" }, 3.80);

      /* ---- a logo se completa ---- */
      // aproximacao nas batidas: o A, o B e o C entram grandes e a camera abre
      // conforme a logo se completa. Origem no centro do bloco ABC.
      gsap.set("#logo", { transformOrigin: "48.5% 75.4%" });
      tl.set("#logo", { scale: 2.6 }, 0);
      tl.to("#logo", { scale: 1, duration: 2.0, ease: "power2.inOut" }, 3.40);

      tl.fromTo(
        "#filos",
        { opacity: 0, y: -90 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" },
        4.60
      );
      tl.fromTo(
        "#emblema",
        { opacity: 0, scale: 0.88, rotation: -3 },
        { opacity: 1, scale: 1, rotation: 0, duration: 1.2, ease: "power3.out" },
        5.70
      );
      tl.fromTo(
        "#tagline",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        7.10
      );
      tl.fromTo(
        "#instituto",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" },
        8.10
      );
      tl.fromTo("#editora", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 9.00);

      /* ---- fecho ---- */
      tl.fromTo(
        "#fecho",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
        14.20
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
