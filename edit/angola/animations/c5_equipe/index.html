    <script>
      const tl = gsap.timeline({ paused: true });

      function entra(figSel, lblSel, t0) {
        const figs = gsap.utils.toArray(figSel);
        figs.forEach(function (el, i) {
          tl.fromTo(
            el,
            { opacity: 0, y: 22, scale: 0.82 },
            { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" },
            t0 + i * 0.11
          );
        });
        tl.fromTo(
          lblSel,
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          t0 + (figs.length - 1) * 0.11
        );
      }

      entra("#g-vol .fig", "#lb-vol", 0.5);
      entra("#g-pro .fig", "#lb-pro", 2.7);
      entra("#g-dir .fig", "#lb-dir", 4.9);

      tl.fromTo(
        "#tag",
        { opacity: 0, y: -60, rotation: -14 },
        { opacity: 1, y: 0, rotation: -4, duration: 1.2, ease: "back.out(1.6)" },
        7.1
      );

      tl.to(["#g-pro", "#g-dir"], { scale: 1.045, duration: 0.5, ease: "power2.inOut" }, 8.5);
      tl.to(["#g-pro", "#g-dir"], { scale: 1.02, duration: 0.6, ease: "power2.inOut" }, 9.0);
      tl.to("#g-vol", { opacity: 0.45, duration: 0.9, ease: "power2.inOut" }, 8.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
