<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #cena {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #veu {
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(
          ellipse 62% 42% at 50% 50%,
          rgba(6, 7, 9, 0.8) 0%,
          rgba(6, 7, 9, 0.55) 55%,
          rgba(6, 7, 9, 0) 100%
        );
      }
      #frase {
        position: relative;
        width: 1520px;
        text-align: center;
        color: #ffffff;
        font-size: 96px;
        font-weight: 700;
        line-height: 1.22;
        letter-spacing: -0.01em;
      }
      #frase .linha {
        display: block;
      }
      #frase .palavra {
        display: inline-block;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16"
      data-width="1920"
      data-height="1080"
    >
      <div id="cena" class="clip" data-start="0" data-duration="16" data-track-index="0">
        <div id="veu"></div>
        <div id="frase">
          <span class="linha">
            <span class="palavra" id="p1">Ninguém</span>
            <span class="palavra" id="p2">se</span>
            <span class="palavra" id="p3">concentra</span>
          </span>
          <span class="linha">
            <span class="palavra" id="p4">com</span>
            <span class="palavra" id="p5">a</span>
            <span class="palavra" id="p6">barriga</span>
            <span class="palavra" id="p7">vazia</span>
          </span>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#veu", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 5.2);

      const palavras = [
        ["#p1", 5.6],
        ["#p2", 6.35],
        ["#p3", 7.0],
        ["#p4", 7.85],
        ["#p5", 8.5],
        ["#p6", 9.1],
        ["#p7", 9.95],
      ];

      palavras.forEach(function (item) {
        tl.fromTo(
          item[0],
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
          item[1]
        );
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
