<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0E1013; }
      #root { width: 100%; height: 100%;
              font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .clip { position: absolute; inset: 0; }
      #cena { background: #0E1013; }
      #frase {
        position: absolute; left: 0; right: 0; top: 858px;
        text-align: center; color: #F2EFE9;
        font-size: 60px; font-weight: 700; letter-spacing: -0.01em;
        opacity: 0;
      }
      svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .figura { fill: #F2EFE9; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5"
         data-width="1920" data-height="1080">
      <div id="cena" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <svg viewBox="0 0 1920 1080">
          <!-- mae: afro volumoso, leve inclinacao para a crianca -->
          <g transform="translate(812,566)">
            <g id="mae" class="figura">
              <path d="M -96,-26 C -102,-104 -56,-150 0,-150 C 56,-150 102,-104 96,-26
                       C 92,20 62,44 40,36 C 48,6 44,-20 30,-34
                       C 6,-16 -22,-14 -44,-28 C -50,-8 -48,16 -40,36
                       C -62,44 -92,20 -96,-26 Z"/>
              <ellipse cx="0" cy="-6" rx="52" ry="62"/>
              <path d="M -116,252 C -116,146 -62,116 0,116 C 62,116 116,146 116,252 Z"/>
            </g>
          </g>
          <!-- crianca: dois marias-chiquinhas, como na logo -->
          <g transform="translate(1136,648)">
            <g id="crianca" class="figura">
              <circle cx="-66" cy="-54" r="34"/>
              <circle cx="66" cy="-54" r="34"/>
              <path d="M -62,-18 C -66,-76 -36,-108 0,-108 C 36,-108 66,-76 62,-18
                       C 58,10 42,26 28,22 C 34,2 30,-14 20,-24
                       C 4,-12 -14,-10 -30,-20 C -34,-6 -32,10 -26,22
                       C -40,26 -58,10 -62,-18 Z"/>
              <ellipse cx="0" cy="0" rx="38" ry="46"/>
              <path d="M -86,166 C -86,96 -46,74 0,74 C 46,74 86,96 86,166 Z"/>
            </g>
          </g>
          <!-- coracao em linha fina ligando as duas -->
          <path id="coracao"
                d="M 974,352
                   C 974,314 932,288 901,309
                   C 868,330 870,380 898,410
                   L 974,488
                   L 1050,410
                   C 1078,380 1080,330 1047,309
                   C 1016,288 974,314 974,352 Z"
                fill="none" stroke="#E90404" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div id="frase">As mães também são acolhidas</div>
      </div>
    </div>
    <script>
      const c = document.getElementById('coracao');
      const L = c.getTotalLength();
      c.style.strokeDasharray = L;
      c.style.strokeDashoffset = L;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mae",     { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 0.10);
      tl.fromTo("#crianca", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.70, ease: "power3.out" }, 0.80);
      tl.to("#coracao",     { strokeDashoffset: 0, duration: 1.35, ease: "power2.inOut" }, 1.50);
      tl.fromTo("#frase",   { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 2.95);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
