<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/fontes/fontes.css" />
    <link rel="stylesheet" href="assets/estilo.css" />
    <style>
      /* Mesma caixa de celular das cenas 2 e 6: 434x918 com borda de 9px,
         o que deixa 416x900 de conteudo. O video do site tem 390x844 CSS,
         entao entra escalado por k = 416/390 = 1,0667 — e toda coordenada
         de toque do JSON da gravacao e multiplicada por esse mesmo k. */
      #fone { left: 240px; top: 90px; width: 434px; height: 918px; }
      /* Os DOIS videos ocupam a mesma caixa: absolutos no mesmo ponto, e
         o data-start de cada um decide qual esta no ar. Sem o absoluto eles
         empilhariam um abaixo do outro no fluxo normal. */
      #fone video {
        position: absolute; left: 0; top: 0; width: 416px; height: 900px;
      }

      /* As duas barras de endereco moram no mesmo canto superior direito,
         fora do caminho do celular quando a camera aproxima. Ancoradas pela
         DIREITA: assim o sufixo "filoseditora.com.br" nao se mexe na troca e
         o subdominio novo cresce para a esquerda — a troca le sozinha. */
      #enderUm, #enderDois { right: 130px; top: 44px; }
      #enderDois { font-size: 34px; opacity: 0; }
      #enderDois .sub {
        background: var(--ouro); color: var(--fundo);
        border-radius: 9px; padding: 2px 9px 4px; margin-right: 1px;
      }

      /* cursor menor que o padrao: ele mora dentro de #fone, entao a
         aproximacao da camera tambem o amplia */
      .cursor { width: 44px; height: 44px; margin: -22px 0 0 -22px; }
      .cursor::after { inset: 15px; }

      /* o pincel e o cursor ficam DENTRO de #fone para acompanharem o zoom
         em vez de descolarem da tela */
      #pincel { position: absolute; left: 0; top: 0; width: 416px; height: 900px;
                opacity: 0; overflow: visible; }
      #pincel path { fill: none; stroke: var(--ouro); stroke-width: 6;
                     stroke-linecap: round; filter: url(#aspero); }

      /* ---------- painel da direita ---------- */
      /* top 248 e nao 196: com o remate no fim, o bloco todo vai de 248 a
         ~827, o que deixa o painel centrado em y no quadro. */
      #painel { position: absolute; left: 870px; top: 248px; width: 910px; }
      #olho   { opacity: 0; margin-bottom: 10px; }
      #tit    { opacity: 0; margin-bottom: 46px; }

      /* os tres degraus do endereco: cada um recuado um pouco mais que o
         anterior, para o olho ler escada em vez de lista */
      .degrau { display: flex; align-items: baseline; gap: 20px;
                margin-bottom: 36px; opacity: 0; }
      #d2 { margin-left: 58px; }
      #d3 { margin-left: 116px; }
      .degrau .seta { flex: none; color: var(--ouro); font-size: 46px;
                      font-weight: 700; line-height: 1; }
      .degrau .q { color: var(--creme); font-size: 52px; font-weight: 700;
                   line-height: 1.18; }
      #d3 .q { color: var(--ouro-cl); }

      #remate { opacity: 0; margin-top: 18px; font-size: 38px;
                max-width: 820px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.37"
         data-width="1920" data-height="1080">
      <div id="cena" class="clip">
        <div class="palco"></div>
        <div class="vinheta"></div>

        <svg width="0" height="0" aria-hidden="true"><defs>
          <filter id="aspero" x="-12%" y="-12%" width="124%" height="124%">
            <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="5"/>
            <feDisplacementMap in="SourceGraphic" scale="4"/>
          </filter>
        </defs></svg>

        <div id="enderUm" class="ender">filoseditora.com.br</div>
        <div id="enderDois" class="ender"><span><span class="sub">filosabc.</span>filoseditora.com.br</span></div>

        <div id="fone" class="fone">
          <!-- cada <video> precisa de id proprio: sem ele o renderizador nao
               descobre a midia e o quadro sai congelado, sem aviso nenhum.
               O data-start vai no video, nunca tambem no involucro. -->
          <video id="telaEditora" src="assets/G02.mp4" muted
                 data-start="0" data-duration="10.21"></video>
          <video id="telaAbc" src="assets/G03.mp4" muted
                 data-start="10.21" data-duration="8.16"></video>

          <svg id="pincel" viewBox="0 0 416 900">
            <!-- Laco em volta de "Projetos sociais". A caixa do item no JSON
                 e esq 24 / topo 141 / 342x64, mas ela atravessa a tela toda
                 e o rotulo so vai ate x~186 em CSS do site: um laco na caixa
                 inteira circularia meio vazio. Entao o laco segue o texto
                 (x 18..222, y 147..225 ja em px da composicao) e so o y vem
                 do JSON sem mexer. -->
            <path d="M 18,185 C 18,157 65,147 120,147 C 175,147 222,157 222,185
                     C 222,213 175,225 120,225 C 65,225 18,213 18,185
                     C 18,169 39,157 77,151"/>
          </svg>
          <div id="cursor" class="cursor"></div>
        </div>

        <div id="painel">
          <p id="olho" class="mao">Caminho 1</p>
          <h2 id="tit" class="titulo">Pelo site da <em>editora</em></h2>
          <div class="degrau" id="d1"><span class="seta">&#9656;</span>
            <span class="q">filoseditora.com.br</span></div>
          <div class="degrau" id="d2"><span class="seta">&#8594;</span>
            <span class="q">Projetos sociais</span></div>
          <div class="degrau" id="d3"><span class="seta">&#8594;</span>
            <span class="q">Filos ABC</span></div>
          <p id="remate" class="apoio">Em poucos toques, tudo o que a Filos faz pelas crianças.</p>
        </div>
      </div>
    </div>

    <script src="assets/kit.js"></script>
    <script>
      /* Cena 3 — Caminho 1: pelo site da editora. 18,37 s.
         Vai de 33,09s a 51,45s na narracao completa; aqui tudo e local.
         Tempos de palavra do dossie (edit/rede/align/dossies/cena_03.md):
           "primeiro" 0.17 | "caminho" 0.79 | "começa" 1.27 | "site" 2.22
           "Editora." 3.91 | "menu," 4.94  | "toca" 5.95  | "Projetos" 6.50
           "sociais" 7.14  | "lá," 8.69    | "Filos" 9.90 | "ABC." 10.21
           "toques," 14.95
         Os dois toques da propria gravacao G02 caem em 4.933 e 6.500 —
         batem com "menu," e "Projetos", entao o cursor acompanha a gravacao
         e a narracao ao mesmo tempo.                                     */

      const k = 1.0667;                        // CSS do site -> px da composicao
      const P = (x, y) => ({ x: Math.round(x * k), y: Math.round(y * k) });
      const MENU  = P(353,  33);               // #hamburguer   -> (377, 35)
      /* O JSON da o centro da CAIXA do item (195,173), mas a caixa ocupa a
         largura da tela e o rotulo acaba em x~186: um dedo ali cairia depois
         do texto. O y e o do JSON; o x desce para cima da palavra. */
      const PROJ  = P(120, 173);               // "Projetos sociais" -> (128, 185)

      const tl = gsap.timeline({ paused: true });

      /* Um dono so para o transform: o CSS nao toca em transform de #fone
         nem de #cursor nem de #enderDois — quem mexe neles e o GSAP. */
      gsap.set("#fone", { scale: 1, x: 0, y: 0 });
      tl.set("#fone", { scale: 1, x: 0, y: 0 }, 0);
      gsap.set("#enderDois", { opacity: 0, scale: 1, transformOrigin: "100% 50%" });
      tl.set("#enderDois", { opacity: 0, scale: 1, transformOrigin: "100% 50%" }, 0);
      tl.set("#cursor", { x: MENU.x, y: MENU.y + 120, opacity: 0, scale: 1 }, 0);

      /* ---------- painel: um degrau por palavra, nunca os tres juntos ----- */
      entra(tl, "#olho", 0.10);                // "O primeiro" 0.00 / 0.17
      entra(tl, "#tit",  0.85);                // chega em 1.47, sobre "começa"
      entra(tl, "#d1",   2.22 - 0.5);          // "site" 2.22

      /* ---------- camera: uma aproximacao so, no alto da tela ------------
         Aproxima o celular INTEIRO, moldura junto — escalando o conteudo a
         tela cortaria no meio da palavra, o que telefone nenhum faz.
         Escala 1,42 em volta do centro de #fone (457,549) leva o bloco do
         menu (centro da pagina em y=219) para y=333, e o item "Projetos
         sociais" fica entre y 363 e 454: tamanho de leitura confortavel.
         O celular sangra para baixo, que e como um close funciona, e em x
         vai de 169 a 785 — nao chega nos 870 do painel.                   */
      tl.to("#fone", { scale: 1.42, x: 20, y: 253,
                       duration: 0.70, ease: "power2.inOut" }, 3.60);

      /* ---------- cursor: os dois toques da gravacao ---------------------
         `toque` encolhe o cursor exatamente em `em`, entao `em` e o tempo da
         palavra. Ele entra de baixo, ja com a camera parada. */
      let onde = { x: MENU.x, y: MENU.y + 120 };
      onde = toque(tl, { ...MENU, em: 4.94, vindoDe: onde, aproxima: 0.45 });
      onde = toque(tl, { ...PROJ, em: 6.50, vindoDe: onde, aproxima: 0.55 });

      /* Traco de pincel em volta de "Projetos sociais". Feito a mao em vez de
         `pincel()` do kit por causa da propria gravacao: o menu da G02 esta
         no ar ate o quadro 195 (t=6,500) e some de uma vez no 196 (6,533).
         Um laco com os 1,9s padrao do kit ficaria 1,4s boiando por cima da
         pagina ja fechada — foi o que apareceu no primeiro contact-sheet.
         Aqui ele se FECHA em 6,50, em cima da palavra "Projetos", e dissolve
         crescendo um pouco, como se o toque o absorvesse. Quem segura a
         enfase depois e o degrau 2 do painel, que sobe em "sociais". */
      (function () {
        const p = document.querySelector("#pincel path");
        const L = p.getTotalLength();
        p.style.strokeDasharray = L;
        p.style.strokeDashoffset = L;
        gsap.set("#pincel", { transformOrigin: "120px 185px" });
        tl.set("#pincel", { opacity: 1, scale: 1, transformOrigin: "120px 185px" }, 6.10);
        tl.fromTo(p, { strokeDashoffset: L },
                     { strokeDashoffset: 0, duration: 0.40, ease: "power2.inOut" }, 6.10);
        tl.to("#pincel", { opacity: 0, scale: 1.07,
                           duration: 0.20, ease: "power2.out" }, 6.50);
      })();
      tl.to("#cursor", { opacity: 0, duration: 0.22, ease: "power2.out" }, 6.52);

      /* degrau 2 sobe em "sociais", logo depois do laco de pincel: a tela
         destaca e o painel escreve — o mesmo conteudo, um depois do outro */
      entra(tl, "#d2", 7.14 - 0.5);

      /* Volta ao plano aberto assim que o degrau 2 assenta, e bem antes da
         troca de pagina: a barra de endereco precisa estar limpa, e com o
         menu ja fechado nao sobra nada para ver de perto. */
      tl.to("#fone", { scale: 1.00, x: 0, y: 0,
                       duration: 0.85, ease: "power2.inOut" }, 7.60);

      entra(tl, "#d3", 9.90 - 0.5);            // "Filos" 9.90

      /* ---------- 10,21: "ABC." — o ponto da cena ------------------------
         A tela troca de pagina (o data-start de #telaAbc faz isso) e a barra
         de endereco troca no MESMO instante — sao o mesmo evento, navegar, e
         separa-los faria a barra parecer atrasada. Depois, em 10,85, so o
         subdominio novo respira, para o olho voltar nele.                  */
      tl.to("#fone", { scale: 1.018, duration: 0.22, ease: "power2.out"   }, 10.21);
      tl.to("#fone", { scale: 1.000, duration: 0.50, ease: "power2.inOut" }, 10.43);

      /* Sem sobreposicao entre as duas barras: a antiga apaga primeiro e a
         nova entra logo atras. Com as duas no ar ao mesmo tempo o canto
         ficava embolado por tres quadros. */
      tl.to("#enderUm",   { opacity: 0, duration: 0.14, ease: "power2.in"  }, 10.21);
      tl.to("#enderDois", { opacity: 1, duration: 0.30, ease: "power2.out" }, 10.35);
      tl.to("#enderDois", { scale: 1.07, duration: 0.26, ease: "power2.out"   }, 10.85);
      tl.to("#enderDois", { scale: 1.00, duration: 0.46, ease: "power2.inOut" }, 11.11);

      /* ---------- remate em "toques," e silencio ate o corte ------------- */
      entra(tl, "#remate", 14.95 - 0.5);       // chega em 14.95, segura 3,4s

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
