<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/fontes/fontes.css" />
    <link rel="stylesheet" href="assets/estilo.css" />
    <style>
      /* Fecho do video. Tres fichas com o que cada link faz, depois a
         linha de tinta ligando as tres a logo da Filos: o mapa da cena 2
         dito de novo, agora como conclusao. */
      .ficha {
        position: absolute; top: 206px; width: 528px; height: 392px;
        border: 3px solid var(--linha); border-radius: 48px;
        background: #1C1712; padding: 44px 42px;
        display: flex; flex-direction: column; gap: 14px; opacity: 0;
      }
      #k1 { left: 148px; }  #k2 { left: 696px; }  #k3 { left: 1244px; }
      .ficha .verbo { font-family: "Caveat Brush", cursive; font-size: 46px;
                      color: var(--ouro-cl); line-height: 1; }
      .ficha .nome  { font-family: "Noto Serif", Georgia, serif; font-size: 58px;
                      color: var(--creme); line-height: 1.1; }
      .ficha .ender {
        /* o endereco mais longo tem 39 caracteres e nao cabe numa linha
           de 392px: sem quebrar, vazava por cima da ficha vizinha */
        position: static; margin-top: auto; align-self: flex-start;
        font-size: 28px; padding: 11px 20px; max-width: 100%;
        white-space: normal; line-height: 1.32;
      }
      .ficha .ender::before { width: 11px; height: 11px; }

      #olho { position: absolute; left: 0; right: 0; top: 118px;
              text-align: center; opacity: 0; }

      #fios { position: absolute; inset: 0; }
      #fios path { fill: none; stroke: var(--ouro); stroke-width: 5;
                   stroke-linecap: round; }

      #marca { position: absolute; left: 50%; top: 800px; height: 100px;
               transform: translateX(-50%); opacity: 0; }
      #casa  { position: absolute; left: 0; right: 0; top: 926px; text-align: center;
               color: var(--suave); font-size: 30px; opacity: 0; }
      #carimbo { position: absolute; left: 1086px; top: 776px;
                 width: 96px; height: 106px; color: var(--ouro); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21.8"
         data-width="1920" data-height="1080">
      <div id="cena" class="clip">
        <div class="palco"></div>
        <div class="vinheta"></div>

        <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
          <symbol id="mao" viewBox="0 0 100 110"><g fill="currentColor">
            <rect x="24" y="50" width="54" height="54" rx="25"></rect>
            <rect x="26" y="14" width="12" height="52" rx="6" transform="rotate(-7 32 40)"></rect>
            <rect x="42" y="6"  width="12" height="56" rx="6"></rect>
            <rect x="58" y="10" width="12" height="54" rx="6" transform="rotate(5 64 40)"></rect>
            <rect x="72" y="24" width="11" height="44" rx="5.5" transform="rotate(14 77 50)"></rect>
            <rect x="6"  y="52" width="13" height="42" rx="6.5" transform="rotate(-42 20 80)"></rect>
          </g></symbol>
        </defs></svg>

        <p id="olho" class="mao">Resumindo</p>

        <svg id="fios" viewBox="0 0 1920 1080" aria-hidden="true">
          <path id="l1" d="M 412 604 L 412 684 L 960 684 L 960 782"/>
          <path id="l2" d="M 960 604 L 960 782"/>
          <path id="l3" d="M 1508 604 L 1508 684 L 960 684 L 960 782"/>
        </svg>

        <div id="k1" class="ficha">
          <span class="verbo">Quem quer conhecer</span>
          <span class="nome">Filos ABC</span>
          <code class="ender">filosabc.<br>filoseditora.com.br</code>
        </div>
        <div id="k2" class="ficha">
          <span class="verbo">Quem quer apadrinhar</span>
          <span class="nome">Corrente 300</span>
          <code class="ender">corrente300.<br>filoseditora.com.br</code>
        </div>
        <div id="k3" class="ficha">
          <span class="verbo">Quem quer apoiar a escola</span>
          <span class="nome">Escolinha em Angola</span>
          <code class="ender">projetosocialangola.<br>filoseditora.com.br</code>
        </div>

        <img id="marca" src="assets/marca-clara.webp" alt="Filos Editora" />
        <p id="casa">A mesma casa</p>
        <svg id="carimbo" viewBox="0 0 100 110"><use href="#mao"/></svg>
      </div>
    </div>

    <script src="assets/kit.js"></script>
    <script>
      /* Cena 12, 21,80s. Tempos locais do dossie:
           "Resumindo:" 0.00 | "ABC." 4.59 | "Corrente" 9.06
           "Escolinha." 14.09 | "links" 14.87 | "casa:" 20.30
           "Editora." 21.11                                            */
      const tl = gsap.timeline({ paused: true });
      entra(tl, "#olho", 0.20, 0.55);

      // uma ficha por vez, chegando na palavra que a nomeia
      [["#k1", 4.59], ["#k2", 9.06], ["#k3", 14.09]].forEach(([k, em]) => {
        tl.fromTo(k, { opacity: 0, y: 34, scale: 0.97 },
                     { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, em - 0.55);
      });
      /* a ficha anterior recua quando a seguinte chega: so uma esta em
         foco por vez, e isso da um batimento no meio do trecho parado */
      tl.to("#k1", { opacity: 0.42, duration: 0.55, ease: "power2.inOut" },  8.70);
      tl.to("#k2", { opacity: 0.42, duration: 0.55, ease: "power2.inOut" }, 13.70);
      // "São links diferentes": as tres voltam juntas
      tl.to(["#k1", "#k2"], { opacity: 1, duration: 0.60, ease: "power2.out" }, 14.87);
      /* enquanto a narracao explica uma ficha, o quadro fica parado 4s.
         Uma deriva lenta de 1,2% mantem a imagem viva sem virar ruido. */
      [["#k1", 4.59, 4.0], ["#k2", 9.06, 4.5], ["#k3", 14.09, 5.5]].forEach(([k, em, d]) => {
        tl.to(k, { scale: 1.012, duration: d, ease: "none" }, em);
      });
      tl.to("#olho", { y: -6, duration: 3.4, ease: "none" }, 0.80);

      /* "São links diferentes... dentro da mesma casa": a tinta desce das
         tres e se junta, e so entao a marca aparece. Nada em paralelo. */
      ["#l1", "#l2", "#l3"].forEach((s, i) => {
        const p = document.querySelector(s), L = p.getTotalLength();
        p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
        tl.to(p, { strokeDashoffset: 0, duration: 1.15, ease: "power2.inOut" }, 15.10 + i * 0.42);
      });
      tl.fromTo("#marca", { opacity: 0, y: 26, scale: 0.96 },
                          { opacity: 1, y: 0, scale: 1, duration: 0.70, ease: "power3.out" }, 18.60);
      tl.to("#casa", { opacity: 1, duration: 0.50, ease: "power2.out" }, 19.60);

      // "casa:" — a mao carimba e o quadro segura ate o fim
      tl.fromTo("#carimbo", { opacity: 0, scale: 1.8, rotate: -16, transformOrigin: "50% 80%" },
                            { opacity: 1, scale: 1, rotate: -7, duration: 0.28, ease: "power3.out" }, 20.30);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
