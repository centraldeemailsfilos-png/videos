<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/fontes/fontes.css" />
    <link rel="stylesheet" href="assets/estilo.css" />
    <style>
      /* Mapa da rede com o desenho da propria pagina Rede Filos.
         Reconstruido em HTML, e nao recortado da gravacao, porque o
         roteiro pede que cada bloco acenda quando e citado — nao da
         para acender um bloco dentro de um video ja gravado. */
      .no {
        position: absolute; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 4px;
        border: 3px solid var(--linha); border-radius: 48px;
        background: #221C15; opacity: 0;
      }
      .no .nome { font-family: "Caveat Brush", cursive; font-size: 52px;
                  line-height: 1.05; color: var(--ouro-cl); }
      .no .sub  { font-size: 30px; color: var(--suave); opacity: 0; }
      .no.ouro  { background: var(--ouro); border-color: var(--ouro); }
      .no.ouro .nome { color: #14110E; }
      .no.ouro .sub  { color: #3A2F12; }

      #nEditora   { left: 680px;  top: 202px; width: 560px; height: 136px; }
      #nAbc       { left: 680px;  top: 426px; width: 560px; height: 136px; }
      #nCorrente  { left: 310px;  top: 728px; width: 460px; height: 150px; }
      #nEscolinha { left: 1150px; top: 728px; width: 460px; height: 150px; }

      /* o mapa inteiro num grupo, para crescer sem remexer coordenada */
      /* a escala do mapa e do GSAP, nao do CSS: se os dois mexerem no
         transform o GSAP sobrescreve o do CSS e o mapa volta ao tamanho */
      #mapa { position: absolute; inset: 0; }
      #fios { position: absolute; inset: 0; }
      #fios path { fill: none; stroke: var(--ouro); stroke-width: 5;
                   stroke-linecap: round; }

      #sobrancelha { position: absolute; left: 96px; top: 74px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.6"
         data-width="1920" data-height="1080">
      <div id="cena" class="clip">
        <div class="palco"></div>
        <div class="vinheta"></div>

        <div id="mapa">
        <svg id="fios" viewBox="0 0 1920 1080" aria-hidden="true">
          <defs>
            <filter id="aspero" x="-12%" y="-12%" width="124%" height="124%">
              <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7"/>
              <feDisplacementMap in="SourceGraphic" scale="4"/>
            </filter>
          </defs>
          <path id="f1" d="M 960 338 L 960 426"/>
          <path id="f2" d="M 960 562 L 960 640"/>
          <path id="f3" d="M 960 640 L 540 640 L 540 728"/>
          <path id="f4" d="M 960 640 L 1380 640 L 1380 728"/>
        </svg>

        <div id="nEditora" class="no ouro">
          <span class="nome">Filos Editora</span>
          <span class="sub">A editora que sustenta tudo</span></div>
        <div id="nAbc" class="no">
          <span class="nome">Filos ABC</span>
          <span class="sub">A casa dos projetos sociais</span></div>
        <div id="nCorrente" class="no">
          <span class="nome">Corrente 300</span>
          <span class="sub">Almoços em Moçambique</span></div>
        <div id="nEscolinha" class="no">
          <span class="nome">Escolinha em Angola</span>
          <span class="sub">Educação e comida</span></div>
        </div>


        <p id="sobrancelha" class="mao">Como a rede se organiza</p>
      </div>
    </div>

    <script src="assets/kit.js"></script>
    <script>
      /* Tempos locais da cena 2, tirados do alinhamento palavra a palavra
         do audio real (edit/rede/align/briefing.json). A cena comeca em
         14,86s da narracao; aqui tudo e relativo a ela.
           "Editora"   2.72    "casa"      3.67
           "ABC"       5.23    "projetos"  7.05
           "Corrente"  9.12    "almoços"  10.93
           "Escolinha" 13.14   "apoio"    15.05   "Angola" 17.63        */
      const tl = gsap.timeline({ paused: true });
      gsap.set("#mapa", { scale: 1.18, transformOrigin: "960px 540px" });
      tl.set("#mapa", { scale: 1.18, transformOrigin: "960px 540px" }, 0);

      entra(tl, "#sobrancelha", 0.30);

      /* cada bloco chega 0,5s antes da palavra: a entrada dura 0,5s,
         entao o quadro de chegada cai exatamente em cima dela */
      function bloco(sel, em) {
        tl.fromTo(sel, { opacity: 0, scale: 0.90, y: 18 },
                       { opacity: 1, scale: 1, y: 0, duration: 0.50, ease: "power3.out" }, em - 0.50);
      }
      function fio(sel, em, dur = 0.55) {
        const p = document.querySelector(sel), L = p.getTotalLength();
        p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
        tl.to(p, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut" }, em - dur);
      }
      const sub = (sel, em) => tl.to(sel + " .sub", { opacity: 1, duration: 0.45, ease: "power2.out" }, em);

      bloco("#nEditora", 2.72);
      // "é a casa": a casa respira, nao entra nada novo
      tl.to("#nEditora", { scale: 1.045, duration: 0.30, ease: "power2.out"   }, 3.67);
      tl.to("#nEditora", { scale: 1.000, duration: 0.55, ease: "power2.inOut" }, 3.97);
      sub("#nEditora", 3.80);

      fio("#f1", 5.23);
      bloco("#nAbc", 5.23);
      sub("#nAbc", 7.05);

      fio("#f2", 8.70, 0.35);
      fio("#f3", 9.12, 0.60);
      bloco("#nCorrente", 9.12);
      sub("#nCorrente", 10.93);

      fio("#f4", 13.14, 0.60);
      bloco("#nEscolinha", 13.14);
      sub("#nEscolinha", 15.05);

      /* "em Angola": a rede inteira respira uma vez e segura ate o corte.
         Antes isto era um box-shadow numa caixa, que aparecia como
         retangulo claro por cima do fundo. */
      tl.to("#fios path", { stroke: "#DDBB6E", strokeWidth: 7,
                            duration: 0.70, ease: "power2.out" }, 17.30);
      tl.to("#mapa", { scale: 1.215, duration: 0.70, ease: "power2.out"   }, 17.30);
      tl.to("#mapa", { scale: 1.180, duration: 0.90, ease: "power2.inOut" }, 18.00);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
