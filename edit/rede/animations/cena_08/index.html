<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/fontes/fontes.css" />
    <link rel="stylesheet" href="assets/estilo.css" />
    <style>
      /* Cena 8 — Confianca. 12,21s, a mais curta do video.
         Um celular com a G08 inteira (a rolagem da propria gravacao e o
         movimento da cena: nao ha camera aqui) e, a direita, as quatro
         palavras do roteiro. Cada uma acende no instante em que e dita.

         Caixa do celular = conteudo + 2x borda: 434 = 416 + 2x9 e
         918 = 900 + 2x9. O video do site tem 390x844 CSS, entao
         k = 416/390 = 1,0667 converte coordenada do site em px da
         composicao. */
      #fone  { left: 240px; top: 90px; width: 434px; height: 918px; }
      #fone video { width: 416px; height: 900px; }

      /* barra de endereco no canto superior direito, como nas cenas 2 e 6 */
      #barra { right: 130px; top: 44px; }

      /* o dedo tem de caber na linha da regra (316x44 CSS do site, ou
         337x47 aqui): um circulo de 46px cobre a linha como um toque de
         verdade, sem engolir o texto em volta */
      .cursor { width: 46px; height: 46px; margin: -23px 0 0 -23px; }
      .cursor::after { inset: 16px; }

      #painel { position: absolute; left: 870px; top: 226px; width: 910px; }
      #olho   { opacity: 0; margin-bottom: 12px; }
      #tit    { opacity: 0; margin-bottom: 56px; }

      /* a lista entra uma vez, como um bloco, e so depois cada item
         acende. Em 12s nao ha tempo de fazer quatro entradas do nada;
         e mesmo assim so um item muda por vez. */
      #lista  { opacity: 0; }
      .item {
        display: flex; align-items: center; gap: 30px;
        margin-bottom: 44px; opacity: 0.4;
      }
      .item:last-child { margin-bottom: 0; }
      .item .ponto {
        flex: none; width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid var(--ouro); background: transparent;
      }
      .item .rot {
        color: var(--suave); font-size: 66px; font-weight: 700;
        line-height: 1.16;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.21"
         data-width="1920" data-height="1080">
      <div id="cena" class="clip">
        <div class="palco"></div>
        <div class="vinheta"></div>

        <div id="barra" class="ender">corrente300.filoseditora.com.br</div>

        <!-- o celular e um div sem data-start: quem tem data-start e o
             video dentro dele, nunca os dois -->
        <div id="fone" class="fone">
          <video id="tela" src="assets/G08.mp4" muted
                 data-start="0" data-duration="12.21"></video>
          <!-- o cursor mora dentro de #fone, para andar com o celular -->
          <div id="cursor" class="cursor"></div>
        </div>

        <div id="painel">
          <p id="olho" class="mao">Para gerar confiança</p>
          <h2 id="tit" class="titulo">Tudo <em>à vista</em></h2>
          <div id="lista">
            <div class="item" id="i1"><span class="ponto"></span>
              <span class="rot">Transparência</span></div>
            <div class="item" id="i2"><span class="ponto"></span>
              <span class="rot">Próximos passos</span></div>
            <div class="item" id="i3"><span class="ponto"></span>
              <span class="rot">Regras</span></div>
            <div class="item" id="i4"><span class="ponto"></span>
              <span class="rot">Empresas</span></div>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/kit.js"></script>
    <script>
      /* Tempos locais da cena 8 (vai de 153,62s a 165,83s da narracao),
         tirados do alinhamento palavra a palavra:
           "confiança," 0.81 | "página" 2.08 | "explica" 2.82
           "contas,"    5.29 | "passos" 6.95 | "regras"  8.81
           "empresas"  10.94 | "parceiras." 11.64
         A G08 foi gravada nestes mesmos tempos: chega em Transparencia
         por volta de 2,0, em Nosso caminho em 6,95, em Regras em 8,81
         (com o toque que abre uma regra em 8,833) e em Empresas em
         10,94. Entao o painel nao precisa comandar nada — basta bater. */
      const k = 1.0667;                       // CSS do site -> px da composicao
      const P = (x, y) => ({ x: Math.round(x * k), y: Math.round(y * k) });
      const REGRA  = P(195, 244);             // G08: summary da 1a regra
      const INICIO = P(238, 392);             // de onde o dedo vem

      const tl = gsap.timeline({ paused: true });

      /* Sem movimento de camera nesta cena. A gravacao rola quatro vezes
         em 12s; aproximar por cima disso embrulha o olho, e o #fone fica
         com o transform livre — ninguem disputa com o GSAP. */
      tl.set("#cursor", { x: INICIO.x, y: INICIO.y, opacity: 0 }, 0);

      /* Abertura: olho, titulo e depois a lista apagada. Um por vez,
         cada entrada caindo em cima da palavra que a justifica:
         o olho em "confiança" (0,81) e o titulo em "página" (2,08). */
      entra(tl, "#olho", 0.25);
      entra(tl, "#tit",  1.46);
      entra(tl, "#lista", 2.30);

      /* Acender: opacidade do item, ponto dourado preenchido com um
         pulso curto e o rotulo subindo para creme. O estado pleno chega
         junto com a palavra (comeca 0,30s antes) e fica — no fim da cena
         as quatro estao acesas, que e o quadro que o corte pega. */
      function acende(sel, em) {
        const t0 = Math.max(0, em - 0.30), dur = 0.45;
        tl.to(sel, { opacity: 1, duration: dur, ease: "power2.out" }, t0);
        tl.to(sel + " .rot", { color: "#F1E8D9", duration: dur, ease: "power2.out" }, t0);
        tl.to(sel + " .ponto", { backgroundColor: "#C9A227", borderColor: "#C9A227",
                                 scale: 1.22, duration: dur, ease: "power2.out" }, t0);
        tl.to(sel + " .ponto", { scale: 1, duration: 0.34, ease: "power2.inOut" }, t0 + dur);
      }

      acende("#i1",  5.29);   // "prestação de contas,"
      acende("#i2",  6.95);   // "os próximos passos"
      acende("#i3",  8.81);   // "as regras"
      acende("#i4", 10.94);   // "o espaço para empresas parceiras"

      /* O toque que abre a primeira regra. Na gravacao ele cai em 8,833,
         dois centesimos depois da palavra "regras" (8,81) — o dedo
         chega na palavra e o encolhimento e o toque. */
      toque(tl, { ...REGRA, em: 8.83, vindoDe: INICIO, aproxima: 0.55 });
      // sai de cena antes da ultima rolagem (9,633), para o dedo nao
      // ficar parado em cima de um conteudo que esta andando
      tl.to("#cursor", { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 9.40);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
